services:
  cursor-api:
    build: .
    container_name: cursor-api
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      - FRONTEND_PATH=/app/static
    volumes:
      - cursor-api-data:/app/data
      - ./static:/app/static:ro

volumes:
  cursor-api-data:

